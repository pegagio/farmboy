schema_version: "1.0"

workflow:
  id: "farmboy-controller-fixture"
  name: "FarmBoy Controller Fixture"
  version: "0.2.0"
  author: "pegagio"
  description: "Exercise clean-before-loop, bounded continuation, gates, and manual fallback."

requires:
  speckit_version: ">=1.0.10.dev0+pegagio.2"
  integrations:
    any: ["codex"]

inputs:
  feature_context:
    type: string
    required: true

steps:
  - id: assess-initial
    type: prompt
    farmboy:
      delegated: true
      agent: FarmBoy Reviewer
    prompt: "Assess current evidence for {{ inputs.feature_context }} and return a validated outcome envelope."
  - id: route-initial
    type: switch
    expression: "{{ steps.assess-initial.output.state }}"
    cases:
      complete:
        - id: initial-success
          type: prompt
          prompt: "Stop at clean success."
      continue:
        - id: corrective-loop
          type: do-while
          condition: "{{ steps.assess-loop.output.state == 'continue' }}"
          max_iterations: 2
          steps:
            - id: corrective-command
              command: "speckit.fixture"
              integration: "codex"
              farmboy:
                delegated: true
                agent: FarmBoy Tasker
              input:
                args: "Correct {{ inputs.feature_context }} using the current evidence."
            - id: assess-loop
              type: prompt
              farmboy:
                delegated: true
                agent: FarmBoy Reviewer
              prompt: "Reassess after this pass and return the outcome envelope."
        - id: route-after-loop
          type: switch
          expression: "{{ steps.assess-loop.output.state }}"
          cases:
            complete:
              - id: loop-success
                type: prompt
                prompt: "Stop at clean success after reassessment."
            needs-human:
              - id: post-loop-decision
                type: gate
                message: "Review the consequential decision after the loop."
                options: ["approve", "defer"]
            blocked:
              - id: loop-blocker
                type: prompt
                prompt: "Stop with the refreshed blocker evidence."
            continue:
              - id: loop-cap-stop
                type: prompt
                prompt: "Stop when progress ends or the loop cap is exhausted."
          default: []
      needs-human:
        - id: consequential-decision
          type: gate
          message: "Review the consequential decision."
          options: ["approve", "defer"]
      blocked:
        - id: initial-blocker
          type: prompt
          prompt: "Stop with a bounded blocker and resume action."
      manual-fallback:
        - id: manual-review
          type: prompt
          prompt: "Stop at the manual-prompt fallback and continue the selected work in the main task."
    default: []
