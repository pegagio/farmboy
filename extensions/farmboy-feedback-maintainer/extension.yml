schema_version: "1.0"

extension:
  id: farmboy-feedback-maintainer
  name: "FarmBoy Feedback Maintainer"
  version: "0.1.1"
  description: "Maintainer-only validation and proposal intake for portable workflow feedback"
  author: pegagio
  license: MIT

requires:
  speckit_version: ">=1.0.1"
  tools:
    - name: python3
      required: true

provides:
  commands:
    - name: speckit.farmboy-feedback-maintainer.intake
      file: commands/speckit.farmboy-feedback-maintainer.intake.md
      description: "Validate a transferred feedback report and record a bounded proposal"

tags:
  - workflow
  - feedback
  - maintainer
  - proposal
