[tools]
python = "3.11.16"
uv = "0.12.5"
"pipx:specify-cli" = "1.0.10.dev0+pegagio.2"

[settings.task]
run_auto_install = false

[env]
_.python.venv = ".venv"

[tasks."python:prepare"]
description = "Prepare the project-local Python environment without replacing existing state"
run = "bash tools/python/prepare.sh"

[tasks."python:check"]
description = "Check the project-local Python and PyYAML environment without changing it"
run = "bash tools/python/check.sh"

[tasks."catalog:build"]
description = "Build reviewed catalog packages from roadmap and wiki source checkouts"
run = "python3 tools/catalog.py build"

[tasks."catalog:install"]
description = "Install the pinned FarmBoy bundle into a consumer project"
run = "python3 tools/catalog.py install"

[tasks."catalog:refresh"]
description = "Refresh the pinned FarmBoy bundle in a consumer project"
run = "python3 tools/catalog.py refresh"

[tasks."catalog:remove"]
description = "Remove the FarmBoy bundle and unchanged FarmBoy controller skills from a consumer project"
run = "python3 tools/catalog.py remove"

[tasks."catalog:agents"]
description = "Install missing agent copies or explicitly reset selected defaults"
run = "python3 tools/catalog.py agents"
