schema_version: "1.0"

bundle:
  id: "spec-kit-flow"
  name: "Spec Kit Flow"
  version: "0.18.0"
  role: "developer"
  description: "Human-directed, merge-bounded flow-back workflows and portable feedback for Spec-Driven Development."
  author: "pegagio"
  license: "MIT"

requires:
  speckit_version: ">=1.0.10.dev0"
  tools: ["python3"]
  mcp: []

integration:
  id: "codex"

provides:
  extensions:
    - id: "flow-roadmap"
      version: "0.4.0"
    - id: "flow-wiki"
      version: "2.0.1"
    - id: "flow-feedback"
      version: "0.2.1"
  workflows:
    - id: "speckit-flow-select-feature"
      version: "0.2.0"
    - id: "speckit-flow-specify"
      version: "0.4.0"
    - id: "speckit-flow-clarify"
      version: "0.5.0"
    - id: "speckit-flow-plan"
      version: "0.5.0"
    - id: "speckit-flow-tasks"
      version: "0.5.0"
    - id: "speckit-flow-analyze-remediate"
      version: "0.6.0"
    - id: "speckit-flow-implement"
      version: "0.9.0"
    - id: "speckit-flow-converge"
      version: "0.5.0"
    - id: "speckit-flow-closeout"
      version: "0.9.0"
    - id: "speckit-flow-wiki-lint-update"
      version: "0.2.0"

tags: ["workflow", "spec-driven-development", "flow-back", "codex"]

agent_package:
  id: "flow-kit-agents"
  version: "0.2.0"
