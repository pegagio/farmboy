schema_version: "1.0"

workflow:
  id: "speckit-flow-analyze-remediate"
  name: "Analyze and Remediate"
  version: "0.5.0"
  author: "pegagio"
  description: "Analyze current artifacts and repeat a shared specification, plan, and task correction waterfall until clean or safely stopped."

requires:
  speckit_version: ">=1.0.10.dev0+pegagio.2"
  integrations:
    any: ["codex"]

inputs:
  feature_context:
    type: string
    required: true
    prompt: "Identify the feature and its current specification, plan, and tasks"
  integration:
    type: string
    default: "codex"
    enum: ["codex"]

steps:
  - id: analysis-remediation-loop
    type: do-while
    assessment_only_first_pass: true
    condition: "{{ steps.assess-analysis.output.state == 'continue' }}"
    max_iterations: 6
    steps:
      - id: prepare-analysis-flowback
        type: prompt
        prompt: >-
          Prepare the next pass for {{ inputs.feature_context }}. On the first pass, set spec_action, plan_action, and task_action to skip: no artifact correction is authorized before fresh analysis. On subsequent passes, use the latest validated assess-analysis findings and next_step_id. For remediate-specification, set all three actions to run. For remediate-plan, set spec_action to skip and plan_action and task_action to run. For remediate-tasks, set only task_action to run. Any unsupported route, missing evidence, blocker, or required operator decision stops before mutation. Return those action fields and specification_args, plan_args, and task_args containing the exact findings and required downstream reconciliation for each stage. Preserve the selected feature, existing reviewed decisions, task IDs, completion markers, and completed work. Scope routine corrections to the operator-authorized feature; consequential product, constitutional, authority, material-scope, or ambiguous-recovery decisions require operator input. Do not invoke another FlowKit workflow or implementation.
      - id: route-specification-remediation
        type: switch
        expression: "{{ steps.prepare-analysis-flowback.output.spec_action }}"
        cases:
          run:
            - id: remediate-specification
              command: "speckit.specify"
              integration: "{{ inputs.integration }}"
              flow_kit:
                delegated: true
                agent: FlowKit-Specifier
              input:
                args: "{{ steps.prepare-analysis-flowback.output.specification_args }}"
          skip: []
      - id: route-plan-remediation
        type: switch
        expression: "{{ steps.prepare-analysis-flowback.output.plan_action }}"
        cases:
          run:
            - id: remediate-plan
              command: "speckit.plan"
              integration: "{{ inputs.integration }}"
              flow_kit:
                delegated: true
                agent: FlowKit-Planner
              input:
                args: "{{ steps.prepare-analysis-flowback.output.plan_args }}"
          skip: []
      - id: route-task-remediation
        type: switch
        expression: "{{ steps.prepare-analysis-flowback.output.task_action }}"
        cases:
          run:
            - id: remediate-tasks
              command: "speckit.tasks"
              integration: "{{ inputs.integration }}"
              flow_kit:
                delegated: true
                agent: FlowKit-Tasker
              input:
                args: "{{ steps.prepare-analysis-flowback.output.task_args }}"
          skip: []
      - id: analyze-artifacts
        command: "speckit.analyze"
        integration: "{{ inputs.integration }}"
        flow_kit:
          delegated: true
          agent: FlowKit-Reviewer
        input:
          args: >-
            Run fresh read-only speckit.analyze for {{ inputs.feature_context }}. Return the full findings, severity, locations, recommendations, and prerequisite errors in a report output field. Do not modify artifacts. The controller classifies the report and owns any separately declared corrections.
      - id: assess-analysis
        type: prompt
        flow_kit:
          delegated: true
          agent: FlowKit-Reviewer
        prompt: >-
          Classify this fresh speckit.analyze report for {{ inputs.feature_context }} against current artifacts: {{ steps.analyze-artifacts.output.report }}. Return a structured outcome envelope with state complete, continue, or blocked; a stable reason_code matching `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits, with words joined by hyphens; never use underscores); repository-relative evidence paths with current SHA-256 digests; remaining_ids; resolved_ids identifying prior findings now resolved; and exactly one of next_step_id or resume_action as required. Use complete only when fresh analysis confirms no unresolved in-scope findings. Use continue for routine, safely repairable findings within the operator-issued scope and set next_step_id to remediate-specification, remediate-plan, or remediate-tasks at the highest affected artifact. The first analysis establishes the finding baseline; later assessments must identify resolved prior findings, not merely changed bytes or command success. Use blocked for a specific product, constitutional, authority, material-scope, or ambiguous-recovery decision or for missing prerequisites, failed commands, stale or unavailable analysis, or unsafe correction; provide a stable resume_action without taking the consequential action. The analyzer report is the authoritative finding source; do not substitute an independent review or treat missing output as clean analysis. Routing fields are state-dependent. For `complete`, omit `next_step_id`, `gate_step_id`, and `resume_action`; for `continue`, include only `next_step_id` targeting a declared loop-body step; for `blocked`, include only a stable `resume_action`. Never include a routing field for `complete`. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).
  - id: report-analysis-outcome
    type: prompt
    prompt: >-
      Report the latest verified analysis outcome for {{ inputs.feature_context }}, resolved and remaining finding IDs, and changed artifact paths. If clean, report Tasks Analyzed without implying feature acceptance or implementation. Otherwise present the exact blocker or required operator decision and safe resumption action, preserving completed corrections. No progress or exhaustion of five correction passes is a bounded stop, not a clean result. Stop this workflow here. Implementation and any consequential change require separate operator action.
