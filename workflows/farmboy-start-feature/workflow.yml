schema_version: '1.0'
workflow:
  id: farmboy-start-feature
  name: Start Feature (Deprecated)
  version: "0.6.0"
  author: pegagio
  description: 'Deprecated: invoke Select Active Feature and Author Active Specification separately.'
  deprecated: true
  replaced_by:
    - farmboy-select-feature
    - farmboy-specify
requires:
  speckit_version: '>=1.0.10.dev0'
  integrations:
    any:
      - codex
inputs:
  feature_request:
    type: string
    default: ''
    prompt: Optional roadmap filter or area of interest; the operator still selects a listed feature
  integration:
    type: string
    default: codex
    enum:
      - codex
  roadmap_decision:
    type: string
    default: ''
  linkage_patch_decision:
    type: string
    default: ''
  feature_selection:
    type: string
    default: ''
steps:
  - id: report-start-feature-deprecation
    type: prompt
    prompt: >-
      This combined workflow is deprecated. Stop without mutations or agent dispatch. Invoke farmboy-select-feature to choose and activate a feature, then separately invoke farmboy-specify to author its specification and brief. Do not automatically invoke either replacement.
