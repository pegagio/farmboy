schema_version: "1.0"

workflow:
  id: "farmboy-implement"
  name: "Implement Eligible Work"
  version: "0.9.1"
  author: "pegagio"
  description: "Repeat the existing implementation skill while eligible tasks remain and progress is evidenced, stopping on completion or a specific bounded blocker."

requires:
  speckit_version: ">=1.0.10.dev0+pegagio.2"
  integrations:
    any: ["codex"]

inputs:
  feature_context:
    type: string
    required: true
    prompt: "Identify the feature and its existing task plan"
  integration:
    type: string
    default: "codex"
    enum: ["codex"]

steps:
  - id: establish-implementation-scope
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Before assessment, bind this invocation's trusted operator request to the validated active feature {{ inputs.feature_context }}. Preserve an explicit operator-named task subset exactly; for an all-remaining-work request, build a full-feature requested-scope snapshot containing every currently unfinished task identity, exact task descriptions/markers, active-pointer/spec/task digests, the actual trusted request reference and a unique safe run ID. Persist this original snapshot and its digest immutably; never replace it with currently eligible IDs. Invoke the installed `implementation-scope` adapter with the exact snapshot and trust reference. Retain the exact `scope` object, `retained_scope_sha256`, original `trusted_request_reference`, and exact `trusted_requested_task_ids` when this is an explicit subset. Initialize one append-only `task_tracking_successors` array for this invocation, shared by marker-only tracking and validated Tasker revisions; it begins empty and never resets with another loop pass. Retain the helper-validated historical prefix count and digest before source effects; carry optional operator-authorized budget bindings only when explicitly supplied, never invent an extension. Stop on stale, missing, ambiguous or out-of-scope input. This step establishes requested scope only; it does not claim eligibility or authorize a particular task effect.
  - id: assess-implementation-state
    type: prompt
    integration: "{{ inputs.integration }}"
    farmboy:
      delegated: true
      agent: FarmBoy Reviewer
    prompt: >-
      Inspect the immutable requested-scope snapshot at {{ steps.establish-implementation-scope.output.scope_sha256 }} and the existing task plan and current validation evidence for {{ inputs.feature_context }} before implementation. Return a structured outcome envelope with state complete, continue, or blocked; a stable reason_code; repository-relative evidence paths with current SHA-256 digests; remaining_ids for unfinished selected tasks and known unresolved defects, using task:T016 and finding:F020-R001 references; resolved_ids; and exactly one of next_step_id or resume_action as required. Mark complete only when no required task remains and relevant validation has passed. Use continue only for specific eligible unfinished tasks and set next_step_id to implement-tasks. Use blocked for a specific required operator answer or a concrete prerequisite, failed validation, or unsafe continuation; provide a stable resume_action. Return selected_task_ids and a separate known findings array with current evidence, exact requirements/deficiencies and existing eligible owners for automatic pre-correction capture. Ground known defects in current inspected source and approved tasks; do not invent or retrospectively discover a baseline to obtain progress credit. This snapshot is the progress baseline; do not invoke implementation or other workflow phases. Routing fields are state-dependent. For `complete`, omit `next_step_id`, `gate_step_id`, and `resume_action`; for `continue`, include only `next_step_id` targeting a declared loop-body step; for `blocked`, include only a stable `resume_action`. Never include a routing field for `complete`. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).
  - id: capture-implementation-baseline
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Before correction, invoke `python3 .specify/farmboy/scripts/python/controller.py implementation-baseline --project "$PWD"` with JSON containing the validated feature_directory, the exact requested task IDs from establish-implementation-scope, and exact known findings from the initial Reviewer. Every finding includes its stable ID, existing selected task_id, artifact_location, violated_requirement, observed_deficiency, exact_correction and current repository-relative path/SHA evidence. Return the helper's immutable baseline and baseline_sha256. Persist that original JSON in the current run evidence before coding; never reconstruct it after correction. Reject a blocked capture. The helper's namespaced remaining_ids establish the validated progress baseline; retain its task/finding identities and owner mapping. The controller retains this baseline for the first pass and each validated next baseline for later passes, without rewriting original recovery evidence.
  - id: assess-readiness-before-core
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      From the project root invoke `python3 .specify/farmboy/scripts/python/controller.py readiness --project "$PWD"` with JSON stdin containing the validated selected feature_directory. Return the complete deterministic output as `readiness_report_json`. The command recomputes active identity, paths, criterion coverage, marker state, current digests and pending future obligations. Any unsafe path, stale evidence, missing verdict, incomplete coverage or unchecked preparation item remains blocked. Do not mutate files or override the core gate.
  - id: check-readiness-before-core
    type: prompt
    integration: "{{ inputs.integration }}"
    farmboy:
      delegated: true
      agent: FarmBoy Readiness Checker
    prompt: >-
      Read and verify the exact FarmBoy helper report {{ steps.assess-readiness-before-core.output.readiness_report_json }} against the current selected-feature evidence for {{ inputs.feature_context }}. Return a read-only `readiness_review` with ready/blocked state, exact blockers, current source/evidence digests, pending future IDs, and safe Analyze resumption action. Do not replace substantive independent review, edit or record evidence, infer an unchecked item's purpose, or mark future outcomes complete.
  - id: gate-readiness-before-core
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Immediately before entering the implementation loop, rerun the installed readiness helper read-only and compare its full source/evidence digest map and pending future IDs with the initial helper report and Checker verdict. Return `readiness_gate` as ready only when both reports and this fresh result agree on the active feature, all current digests, and future IDs; otherwise return blocked with exact evidence and safe Analyze resumption. Do not mutate files.
  - id: assess-implementation-start-milestone
    type: prompt
    integration: "{{ inputs.integration }}"
    farmboy:
      delegated: true
      agent: FarmBoy Reviewer
    prompt: >-
      Before any Coder dispatch, independently assess lifecycle-start readiness for {{ inputs.feature_context }}. Require the initial implementation assessment to be continue with exact currently eligible requested task IDs, current reviewed spec/plan/tasks, verified dependency closure, the current readiness report and fresh readiness gate, and every exact declared native assignment. If no authorized eligible task exists, any proof is stale or contradictory, or a required assignment is unavailable, return blocked with the exact prerequisite and safe resumption. On ready, persist a current FarmBoy Reviewer assessment and strict phase-lifecycle request under the feature's `validation/phase-lifecycle/` directory. Bind the approved policy SHA-256 `09738d2d65ab12117308d586f77a2140a1cedebbad9d9bc33f0408fb822f1bd4`, exact active identity, current source/evidence digests, pending future IDs, the Readiness Checker assessment, and all five `in-progress` checks. Return only its current relative path/digest and eligibility evidence. This request file is not trusted authority.
  - id: prepare-implementation-start-milestone
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Invoke `python3 .specify/farmboy/scripts/python/controller.py phase-lifecycle --project "$PWD"` with the strict request at {{ steps.assess-implementation-start-milestone.output.request_path }} on JSON stdin. Return the complete assessment as `lifecycle_assessment`. FarmBoy must not write roadmap bytes. Preserve blockers and questions exactly.
  - id: route-implementation-start-milestone
    type: switch
    expression: '{{ steps.prepare-implementation-start-milestone.output.lifecycle_assessment.state }}'
    cases:
      ready:
        - id: revalidate-implementation-start-milestone
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: |
            Rebuild the same strict request with action `revalidate` and the unchanged proposal from {{ steps.prepare-implementation-start-milestone.output.lifecycle_assessment.proposal }}. Invoke the FarmBoy phase-lifecycle adapter immediately before the owner effect and return its complete assessment. Any changed target, source, policy, review or digest blocks before the write.

            Rendered callback construction (send its JSON stdout to the phase-lifecycle adapter):
            ```python
            import json
            from pathlib import Path

            request = json.loads(Path("{{ steps.assess-implementation-start-milestone.output.request_path }}").read_text(encoding="utf-8"))
            request["action"] = "revalidate"
            request["proposal"] = json.loads(r'''{{ steps.prepare-implementation-start-milestone.output.lifecycle_assessment.proposal }}''')
            print(json.dumps(request))
            ```
        - id: route-implementation-start-revalidation
          type: switch
          expression: '{{ steps.revalidate-implementation-start-milestone.output.lifecycle_assessment.state }}'
          cases:
            ready:
              - id: apply-implementation-start-milestone
                type: command
                command: speckit.flow-roadmap.write
                integration: '{{ inputs.integration }}'
                input:
                  args: >-
                    {{ steps.revalidate-implementation-start-milestone.output.lifecycle_assessment.roadmap_delta }}
                farmboy:
                  delegated: true
                  agent: FarmBoy Roadmap Agent
              - id: verify-implementation-start-milestone
                type: prompt
                integration: "{{ inputs.integration }}"
                farmboy:
                  delegated: true
                  agent: FarmBoy Reviewer
                prompt: >-
                  Independently verify the workflow receipt derived from the generic amendment, actual current roadmap state and source/evidence digests. Accept only an applied `specced→in-progress` receipt or independently supported event-free no-op; confirm it precedes any Coder dispatch. Failed, stale, not-applied, indeterminate or partial outcomes block coding and retain a safe resumption. Return state verified or blocked and the exact evidence. Do not claim completion, verification or acceptance. Use FarmBoy controller phase-lifecycle action `verify-effect` with the exact revalidated proposal, trusted command_succeeded boolean and main-retained occurred_at timestamp. Persist the returned workflow receipt under validation/phase-lifecycle/; re-read and hash it before returning verified.
            no-op:
              - id: verify-existing-implementation-start-state-after-revalidation
                type: prompt
                integration: "{{ inputs.integration }}"
                farmboy:
                  delegated: true
                  agent: FarmBoy Reviewer
                prompt: Independently verify current readiness and milestone evidence for the consistent advanced roadmap state, with no duplicate event or downgrade. Return verified or blocked and current hashes.
            blocked: []
            question: []
      no-op:
        - id: verify-existing-implementation-start-state
          type: prompt
          integration: "{{ inputs.integration }}"
          farmboy:
            delegated: true
            agent: FarmBoy Reviewer
          prompt: Independently verify current readiness and milestone evidence for the consistent advanced roadmap state, with no duplicate event or downgrade. Return verified or blocked and current hashes.
      blocked: []
      question: []
  - id: verify-lifecycle-and-readiness-before-coding
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Return `state: ready` only when the independently completed implementation lifecycle verification is verified and the most recent readiness gate is ready with matching current source/evidence digests, active identity, eligible authorized task scope, dependencies, and exact assignments. Otherwise return blocked with the lifecycle receipt/readiness gap and safe resumption. No Coder may run on a blocked or unverified milestone.
  - id: route-readiness-before-core
    type: switch
    expression: '{{ steps.verify-lifecycle-and-readiness-before-coding.output.state }}'
    cases:
      ready:
        - id: implementation-loop
          type: do-while
          condition: "{{ steps.route-scoped-execution.output.state == \"continue\" }}"
          max_iterations: 5
          controller_loop_mode: implementation_scope
          steps:
            - id: route-scoped-entry
              type: prompt
              integration: "{{ inputs.integration }}"
              prompt: >-
                Before any Coder dispatch in this loop pass, validate the immutable requested-scope snapshot and its retained digest against the active pointer, spec.md and tasks.md, supplying the complete previously validated `task_tracking_successors` separately so Tasker marker changes do not rebind the original scope. Load the controller-owned history for that exact scope; if it has no events, use only the canonical zero-event history returned by the helper. Invoke `implementation-eligibility --project "$PWD"` with the current independent task assessment, exact requested IDs, dependency closure, decisions, owner-source access/route, source/readiness evidence, successor chain, main-retained historical prefix count/digest, any explicitly authorized budget receipt/digest, and remaining session budget; use only its validated eligible IDs and require independently complete proof for any tracked checked task. On the first pass use the initial independent assessment; on re-entry use the current prior-pass Reviewer result and the exact same-child answer if one was required. Invoke `implementation-route --project "$PWD"` with that actual assessment, eligible IDs, exact declared node IDs `prepare-scoped-prerequisites` and `implement-tasks`, scope/trust reference, successor chain and retained history digest. When the assessment says complete, include `eligibility_request` with the exact complete JSON request just validated by `implementation-eligibility`; the route adapter reruns that check and permits completion only when every requested task has current complete proof. The helper permits only preparation/first-source membership while source_attempts_started is zero; after an attempt it applies the generic prior/current predicate. Return the complete helper result without editing tasks or roadmap state. Before any correction, validate the previous assessment against current evidence and retain its exact envelope with `retained_previous_assessment_sha256`, the SHA-256 of canonical JSON containing `scope_sha256` and `assessment` as specified in the controller protocol. Whenever routing with `previous_assessment`, forward that independently main-retained digest; never accept a child-selected digest or recompute it after effects. Preserve the exact validated callback inputs as output fields `scope`, `eligibility`, `history`, `task_tracking_successors`, `previous_assessment`, `retained_previous_assessment_sha256` and `baseline`; do not reconstruct these fields from task markers or summaries.
            - id: prepare-scoped-prerequisites
              type: switch
              expression: '{{ steps.route-scoped-entry.output.next_step_id }}'
              cases:
                prepare-scoped-prerequisites:
                  - id: record-preparation-session-start
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Immediately before dispatch, atomically append and persist a `coder-session-start` history event through the installed `implementation-history` adapter. Bind the validated original scope, separate validated `task_tracking_successors`, and current retained history digest; declare `prepare-scoped-prerequisites`, execution_kind `preparation`, a new unique child session ID, actual current UTC occurrence time, current repository-relative evidence hashes, coder_sessions_started plus one, and unchanged source_attempts_started. Revalidate current history, authority, exact FarmBoy Coder assignment, source route and the global five-session cap. Dispatch no Coder unless the adapter returns ready and the persisted successor digest.
                  - id: run-scoped-preparation
                    command: speckit.implement
                    integration: '{{ inputs.integration }}'
                    farmboy:
                      delegated: true
                      agent: FarmBoy Coder
                    input:
                      args: >-
                        Fulfill only the currently eligible, scoped administrative prerequisites for {{ inputs.feature_context }}. Use exact per-task administrative completion proof; perform no source implementation and claim zero implementation progress. If the child asks a question, preserve it verbatim and resume that same child without opening another session. Record any failure, question or completion as the outcome for the already-counted session.
                  - id: record-preparation-session-outcome
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Append and persist the exact `coder-session-outcome` for this same child via `implementation-history`, including completed, failed-dispatch or question-stopped. For an operator question, retain the same active child and session; append only `operator-input` after its answer and resume that child without a new session-start event. Preserve partial effects and never count administrative completion as source resolution.
              default: []
            - id: implement-tasks
              type: switch
              expression: '{{ steps.route-scoped-entry.output.next_step_id }}'
              cases:
                implement-tasks:
                  - id: record-source-session-and-attempt
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Immediately before the modeled source Coder dispatch, use the installed `implementation-history` adapter to append and persist a new `coder-session-start`, then a `source-attempt-start` event, each bound to the retained predecessor digest, exact original scope and separate validated `task_tracking_successors`, declared node `implement-tasks`, unique child/session ID, current UTC occurrence time and current evidence hashes. Use `first-source-execution` only when the persisted source-attempt count is zero; otherwise use `corrective-source-execution` only after the generic route has authorized re-entry. Increment the common coder_sessions_started before every new child and source_attempts_started before dispatch. Revalidate the authorized run ceiling (five by default; an explicit main-retained scope/history-bound budget extension may increase it), first/corrective route membership, readiness, authorization and exact assignment. No Coder is dispatched until both atomic appends succeed; a later failure or question still consumes these counts.
                  - id: run-scoped-source-implementation
                    command: speckit.implement
                    integration: '{{ inputs.integration }}'
                    farmboy:
                      delegated: true
                      agent: FarmBoy Coder
                    input:
                      args: >-
                        Implement all currently eligible source tasks inside the immutable requested scope for {{ inputs.feature_context }}. Keep requested, eligible, pending, completed, administrative-prerequisite and outside IDs distinct. Preserve exact independently reviewed finding identities/corrections for correction only through their existing eligible task IDs. Immediately before each task effect, invoke `implementation-activation --project "$PWD"` with the unchanged original scope, complete validated Tasker successor chain, current eligibility digest, predecessor baseline, task ID, exact required source paths, freshly observed preimages, source-owner route/access, readiness and retained history. Proceed only on a ready activation bound to the current task and scope. Continue only through the authorized task plan, preserving exact blockers, questions and partial effects. Same-child questions resume that child and do not consume another session. Do not re-specify, re-plan, re-task manually, re-analyze, invoke another workflow or change roadmap state.
                  - id: record-source-session-outcome
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Append the source Coder child's completed, failed-dispatch or question-stopped outcome through `implementation-history`, preserving partial effects. A question answer is relayed to that same child; append an operator-input event to the existing session and do not start or count another session.
              default: []
            - id: assess-implementation-after-pass
              type: prompt
              integration: "{{ inputs.integration }}"
              farmboy:
                delegated: true
                agent: FarmBoy Code Reviewer
              prompt: >-
                Inspect the current task checklist, implementation changes, and validation evidence for {{ inputs.feature_context }} after this implementation session. Independently review the changed code for correctness against the selected tasks, regressions evident from the diff, and adequate focused validation. Return exact findings and repository-relative evidence. Keep findings within the existing task plan. If findings have an eligible open correction task, use continue for that task. If an in-scope finding has no eligible open correction task, use continue for the exact affected task identity after requesting the declared Tasker-owned revision route in this same Implement invocation; do not ask for routine reopen/add approval. Return `task_revision_action` as the string `skip` when every finding has an eligible open task, or `revise` when at least one in-scope finding lacks one, in the separate workflow-specific result. When action is revise, return the exact stable findings as a valid JSON string field named `findings_json`, alongside the structured findings. Missing prerequisites, unsafe recovery, scope/authority/product decisions, or unavailable exact assignment use blocked with a precise resume_action. Return a standalone field `outcome_envelope` containing only the validated state, reason_code, repository-relative evidence paths with current SHA-256 digests, remaining_ids, resolved_ids and its state-dependent routing field. Continue has only next_step_id; blocked has only resume_action; complete has no routing field. Keep review, task_revision_action, finding details, and completion proof in sibling fields, outside this envelope. Mark complete only when the task plan is finished, code review has no material unresolved findings, and relevant validation passed. Use continue only when specific eligible tasks will be available to a safe next Coder session after any declared Tasker revision, and fresh independent review substantiates a completed prior task or resolution of a prior recorded defect, even while its parent task remains open; set next_step_id to implement-tasks. Automate closure assessment against the frozen baseline supplied by the main controller (initial capture on the first pass, validated next baseline on later passes). Return a review object with reviewer: FarmBoy Code Reviewer, baseline_sha256, one findings entry per prior ID containing id, task_id, status resolved/unresolved and current evidence; resolved entries include a resolution_summary explaining how the recorded requirement and deficiency are eliminated. Return genuinely new findings separately with their full identity/owner/source fields, and completed_task_ids plus task_completion_evidence only for whole substantiated tasks. Invoke the installed controller implementation-progress command with the exact frozen baseline, independently retained baseline digest, and this review object. A blocked validation stops; never infer closure from missing or renamed findings, changed bytes, commands, reports or checkboxes. On ready validation use its remaining_ids and resolved_ids in the strict outcome and return its next baseline separately for the controller's next pass. Persist the old baseline and this review/result in recovery evidence. Unresolved findings retain their identities and current source evidence; new findings receive no retrospective resolution credit. Native reviewer identity is verified by the controller's actual assignment, not by the review object's label or hash. Review an attributable implementation delta with before/after evidence; if unavailable, stop with an untrusted-delta recovery. Return exact review findings separately, retaining stable ID, task_id, artifact_location, violated requirement, observed deficiency, and exact correction. Keep parent tasks unchecked until every requirement is substantiated; no operator reauthorization is required solely because a task is still open. Fresh independent code assessment must confirm substantive resolution; task edits do not resolve findings or earn progress. A still-open finding remains visible while another prior finding is genuinely resolved; no measurable implementation progress and the authorized run cap (five by default) stop with exact reasons. Preserve the exact unanswered product question and never infer an answer; successful commands cannot discharge findings. A checkbox change, child claim, or successful command alone is not completion evidence. Do not re-specify, re-plan, re-task manually, re-analyze, or invoke another FarmBoy workflow. Routing fields are state-dependent. For `complete`, omit `next_step_id`, `gate_step_id`, and `resume_action`; for `continue`, include only `next_step_id` targeting a declared loop-body step; for `blocked`, include only a stable `resume_action`. Never include a routing field for `complete`. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).
            - id: route-post-assessment
              type: switch
              expression: '{{ steps.assess-implementation-after-pass.output.state }}'
              transition_labels:
                continue: work-remains
                complete: complete
                blocked: blocked
              cases:
                continue:
                  - id: route-task-revision
                    type: switch
                    expression: '{{ steps.assess-implementation-after-pass.output.task_revision_action }}'
                    transition_labels:
                      skip: existing-task
                      revise: revise
                    cases:
                      skip: []
                      revise:
                        - id: preflight-task-revision-snapshot
                          type: prompt
                          integration: "{{ inputs.integration }}"
                          prompt: >-
                            Before reading any task-plan bytes, invoke the installed helper from the repository root with valid JSON on stdin: `python3 .specify/farmboy/scripts/python/controller.py task-revision-preflight --project "$PWD"`. Pass `feature_directory` from `inputs.feature_context` and `tasks_path` as that directory plus `/tasks.md`. It verifies `.specify/feature.json`, lexical feature/task/spec paths, symlink-free parents, and physical containment before reading the selected feature's `tasks.md` and `spec.md`; it returns `preflight_json` with their exact text and digests. If state is blocked, route directly to the stop branch without preparing a snapshot, reading task bytes, or dispatching Tasker.
                        - id: route-task-revision-preflight
                          type: switch
                          expression: '{{ steps.preflight-task-revision-snapshot.output.state }}'
                          cases:
                            ready:
                              - id: prepare-task-revision
                                type: prompt
                                integration: "{{ inputs.integration }}"
                                prompt: >-
                                  Construct `task_snapshot_json` from `preflight-task-revision-snapshot.output.preflight_json` only; do not reread tasks.md. Add the exact latest independent Code Reviewer finding IDs/corrections as `{id, exact_correction}` entries, and the unique eligible existing task IDs justified by those findings and present in the frozen task text. Preserve `feature_directory`, `tasks_path`, `tasks_before_text`, and `tasks_before_sha256` from preflight. Also retain the selected feature's exact `specification_text` and `specification_sha256` as the approved specification scope. Set `permitted_added_task_owner` to `FarmBoy Tasker`. Return one valid JSON string. This bounded repair is authorized by the Implement invocation; do not ask for another routine approval. Stop for missing/stale evidence, unsafe changes, scope/authority/product decisions, or absence of a reviewed Tasker assignment. Do not change files.
                              - id: freeze-task-revision-scope
                                type: prompt
                                integration: "{{ inputs.integration }}"
                                prompt: >-
                                  Parse `prepare-task-revision.task_snapshot_json` as JSON; do not copy unverified IDs or derive authorization from Tasker output. Construct `frozen_scope` with exactly these keys: `findings` (snapshot exact `{id, exact_correction}` objects), `eligible_task_owners` (each selected existing `eligible_task_id` mapped to literal owner `FarmBoy Tasker`), `approved_specification_sha256` (snapshot `specification_sha256`), `permitted_added_task_owner: FarmBoy Tasker`, and `tasker_owner: FarmBoy Tasker`. Include only unique eligible IDs present in the snapshot's before-text and justified by a frozen finding. Bind `feature_directory` and `tasks_path` from the snapshot. The Tasker may edit only task records attributable to these findings within this approved selected-feature specification scope. Do not infer additional findings or approve unrelated governance, configuration, or product work. Do not modify files.
                                  Before Tasker dispatch, run `python3 .specify/farmboy/scripts/python/controller.py task-revision-scope` from the project root with valid JSON on stdin: `{"feature_directory": <snapshot feature_directory>, "tasks_path": <snapshot tasks_path>, "frozen_scope": <the exact frozen_scope object>}`. Capture `scope_sha256` alongside the scope. Return `frozen_scope` as an object and `scope_sha256` as a separate string; stop if the helper reports blocked.
                              - id: revalidate-task-revision-snapshot
                                type: prompt
                                integration: "{{ inputs.integration }}"
                                prompt: >-
                                  Immediately before the Tasker step, rerun the installed helper command `python3 .specify/farmboy/scripts/python/controller.py task-revision-preflight --project "$PWD"` with JSON containing the frozen `feature_directory`, `tasks_path`, and `expected_tasks_sha256` from the preflight snapshot. Require state `ready`, the same active identity, task digest, and `specification_sha256`; otherwise return its exact blocker and do not dispatch Tasker. This second check is adjacent to dispatch and makes no file changes.
                              - id: route-task-revision-snapshot
                                type: switch
                                expression: '{{ steps.revalidate-task-revision-snapshot.output.state }}'
                                cases:
                                  ready:
                                    - id: revise-task-plan
                                      command: speckit.tasks
                                      integration: '{{ inputs.integration }}'
                                      farmboy:
                                        delegated: true
                                        agent: FarmBoy Tasker
                                      input:
                                        args: >-
                                          Revise only {{ inputs.feature_context }} tasks.md for the exact frozen independent Code Reviewer findings. Use the preflight-verified snapshot object in {{ steps.prepare-task-revision.output.task_snapshot_json }} and exact frozen scope object in {{ steps.freeze-task-revision-scope.output.frozen_scope }}; do not trust any IDs or scope that you generate yourself. Use the validated selected feature identity, task path, complete task history, before digest, approved specification digest, and pre-Tasker scope digest {{ steps.freeze-task-revision-scope.output.scope_sha256 }}. Return one `task_mappings` entry per frozen finding with exact `finding_id`, `task_ids`, and owner `FarmBoy Tasker`; finding coverage must be exact. Reopen only eligible existing tasks or append only necessary in-scope tasks when no eligible existing task owns the correction. Preserve all unrelated task IDs, completion markers, completed descriptions, accepted decisions, and stable finding IDs. Return the revision as a valid JSON string field `tasker_result_json` containing `revision_state`, `feature_directory`, `tasks_path`, `tasks_before_sha256`, `tasks_after_sha256`, `finding_ids`, `task_mappings`, `reopened_task_ids`, `added_task_ids`, and `preserved_completed_task_ids`. Do not change specifications, plans, governance, scope, or implementation files; task edits are not implementation progress.
                                    - id: review-task-revision-scope
                                      type: prompt
                                      integration: "{{ inputs.integration }}"
                                      prompt: >-
                                        Independently compare the actual before/after task text in {{ steps.prepare-task-revision.output.task_snapshot_json }} and Tasker's exact structured result {{ steps.revise-task-plan.output.tasker_result_json }} with the frozen scope {{ steps.freeze-task-revision-scope.output.frozen_scope }} and the approved specification text/digest for the validated selected feature in that snapshot. Confirm every finding is covered by necessary task changes and each changed task implements only its mapped correction inside that selected feature's approved scope. Reject invented, omitted, substituted, wrong-owner, unrelated-scope, governance, configuration, or product changes. Return `semantic_review` JSON with `reviewer: main-controller`, `state: approved` or `rejected`, the exact frozen `finding_ids`, exact mapped `task_ids`, the pre-Tasker `scope_sha256` from `freeze-task-revision-scope.output.scope_sha256`, and a concise evidence-based rationale. This is a controller semantic check, not an operator approval gate; do not ask the operator to approve routine task revision.
                                    - id: validate-task-revision
                                      type: prompt
                                      integration: "{{ inputs.integration }}"
                                      prompt: >-
                                        Parse each JSON-string step output into an object before constructing the validator input. Pipe one valid JSON object to the installed consumer helper command `python3 .specify/farmboy/scripts/python/controller.py validate-task-revision --project "$PWD"` with these fields: `feature_directory` and `tasks_path` from the prepared snapshot; `tasks_before_text` from that snapshot; `frozen_scope` as the frozen scope object; `tasker_result` as the parsed `tasker_result_json` object; and `semantic_review` as the parsed semantic-review object. Also pass the exact immutable `requested_scope`, retained scope digest, original trusted request reference, exact trusted subset IDs when applicable, and current complete `task_tracking_successors` chain from the controller. Do not pass JSON strings where objects are required. Accept only state ready with exact frozen finding coverage and mapping, authorized task ownership, approved scope digest, affirmative semantic review, selected-feature lexical path/parent safety and containment, matching before/after digests, unique append-only IDs, no deletions/renumbering or unrelated marker/description changes, preserved completed history, and substantive_progress false. The controller returns a distinct `task_tracking_successor` record for this validated task-plan revision; append it to the successor chain without changing the original scope or history. Return that record as structured `task_tracking_successor` output with the exact validation result. If blocked, stop this Implement invocation with its exact reason and safe resumption; do not begin another Coder pass or count task edits as progress. A ready revision makes its eligible IDs available to the next bounded Coder pass, followed by fresh independent Code Reviewer assessment.
                                    - id: route-task-revision-result
                                      type: switch
                                      expression: '{{ steps.validate-task-revision.output.state }}'
                                      cases:
                                        ready:
                                          - id: advance-progress-after-task-revision
                                            type: prompt
                                            integration: "{{ inputs.integration }}"
                                            prompt: >-
                                              After ready Tasker validation and before Coder reentry, invoke the installed controller implementation-baseline-transition command with the latest validated progress baseline, its independently retained digest and the exact full task_revision_payload already validated. The helper validates the Tasker delta again against original finding corrections, source scope and before task descriptions, preserves prior source/finding history, and returns a new baseline with zero substantive_progress. Persist both old and new baseline evidence and use the returned baseline for the next Code Reviewer. A checked Coder marker alone cannot discharge an independently pending task.
                                          - id: route-progress-tasker-transition
                                            type: switch
                                            expression: '{{ steps.advance-progress-after-task-revision.output.state }}'
                                            cases:
                                              ready: []
                                              blocked:
                                                - id: stop-progress-tasker-transition
                                                  type: prompt
                                                  integration: "{{ inputs.integration }}"
                                                  prompt: >-
                                                    Stop before Coder reentry. Report the exact baseline transition blocker and safe recovery. Do not reconstruct the original baseline, overwrite history or count task edits as progress.
                                        blocked:
                                          - id: stop-task-revision-result-blocked
                                            type: prompt
                                            integration: "{{ inputs.integration }}"
                                            prompt: >-
                                              Stop this Implement invocation. Report the exact blocked Tasker revision reason and safe resumption action. Preserve the partial task edit for operator review; do not run Coder, dispatch a fallback, or claim that the code finding is resolved.
                                      default: []
                                  blocked:
                                    - id: stop-task-revision-dispatch-blocked
                                      type: prompt
                                      integration: "{{ inputs.integration }}"
                                      prompt: >-
                                        Stop this Implement invocation. Report the exact pre-dispatch snapshot revalidation blocker and safe resumption action. Do not dispatch Tasker or claim the code finding is resolved.
                                default:
                                  - id: stop-task-revision-dispatch-unrecognized
                                    type: prompt
                                    integration: "{{ inputs.integration }}"
                                    prompt: >-
                                      Stop this Implement invocation because the pre-dispatch snapshot revalidation returned no recognized state. Do not dispatch Tasker.
                            blocked:
                              - id: stop-task-revision-preflight-blocked
                                type: prompt
                                integration: "{{ inputs.integration }}"
                                prompt: >-
                                  Stop this Implement invocation. Report the exact preflight blocker and safe resumption action. Do not read the task snapshot, dispatch Tasker, or claim the code finding is resolved.
                          default:
                            - id: stop-task-revision-preflight-unrecognized
                              type: prompt
                              integration: "{{ inputs.integration }}"
                              prompt: >-
                                Stop this Implement invocation because the task revision preflight returned no recognized state. Do not dispatch Tasker.
                  - id: preflight-reviewed-task-tracking
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Before dispatching ordinary tracking to FarmBoy Tasker, snapshot the exact current selected-feature tasks.md through `task-revision-preflight` in the installed controller. Bind the validated active feature and the expected predecessor task digest from the immutable requested scope or the last validated Tasker successor; do not refresh or replace the original scope. Return the full current before-text and digest for the marker-only transition. Stop if the pointer/specification changed, the predecessor is stale, or task paths are unsafe.
                  - id: track-reviewed-task-outcomes
                    command: speckit.tasks
                    integration: '{{ inputs.integration }}'
                    farmboy:
                      delegated: true
                      agent: FarmBoy Tasker
                    input:
                      args: >-
                        Track only whole task IDs independently substantiated by assess-implementation-after-pass.output.completed_task_ids, including current prerequisite proof. Use the exact preflight snapshot in preflight-reviewed-task-tracking.output; do not reread a different task plan, change descriptions, add/remove/renumber IDs, reverse markers, or alter unrelated records. Return exact changed task IDs and digests bound to the preflight before-text; ordinary Tasker tracking earns zero source-resolution credit.
                  - id: validate-reviewed-task-tracking
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Preserve the original requested-scope object and retained digest byte-for-byte. If Tasker changed markers, append one successor record to `task_tracking_successors` using the prior record digest (or the zero digest), exact preflight before-text, exact current after-text, current scope digest, exact `FarmBoy Tasker` assignment, Tasker before/after hashes and changed IDs, and the matching Code Reviewer completed IDs and current review evidence. Changed IDs must match both records exactly; reject additions, deletions, renumbering, reorder, description edits, regressions, replay, stale pointer/specification, stale evidence, or any completed ID outside the original requested IDs. Pass the unchanged scope, independently retained original digest, original trusted request reference, and complete successor chain to `implementation-scope --project "$PWD"`. Return ready only if the helper verifies the original request plus every marker-only successor against current bytes. Return the newly validated record as structured `task_tracking_successor` output, or `null` when no marker changed. Carry the chain and main-retained historical prefix count/digest unchanged into all later eligibility, activation, history and progress adapters, together with any explicitly authorized run-budget receipt/digest. Retain a newly returned validated complete prefix before later source effects; new suffix evidence and current fulfillment proofs remain current. Ordinary marker tracking earns no source-resolution credit; the fresh eligibility assessment must still include exact requirement-complete proof before treating a task as completed.
                  - id: reassess-readiness-before-reentry
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      After the Code Reviewer continue verdict and any Tasker revision or skip, rerun the installed readiness helper read-only for the validated active feature and return `readiness_reentry_report_json`. Recompute current task/spec/checklist/evidence digests and pending future IDs. If task, spec, evidence, identity, or path state changed such that the recorded independent review is stale, preserve the exact blocked finding and require Analyze to establish fresh evidence; do not request another Reviewer routinely and do not enter the next Coder pass.
                  - id: check-readiness-before-reentry
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    farmboy:
                      delegated: true
                      agent: FarmBoy Readiness Checker
                    prompt: >-
                      Independently check {{ steps.reassess-readiness-before-reentry.output.readiness_reentry_report_json }} after the prior Code Reviewer continue verdict and any authorized Tasker revision. Return a read-only `readiness_reentry_review` with ready/blocked, exact source/evidence digests, pending future IDs, stable blocker IDs, and safe Analyze resumption. Do not repair, record, synthesize Reviewer evidence, or mark future work complete.
                  - id: gate-readiness-before-reentry
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Immediately before the next loop re-entry, rerun the readiness helper read-only and compare active identity, complete digest map, pending future IDs, and findings with reassess-readiness-before-reentry.output.readiness_reentry_report_json and check-readiness-before-reentry.output.readiness_reentry_review. Return `readiness_gate` ready only if all evidence is still current and both reports agree; otherwise return blocked with exact stale-input evidence and safe Analyze resumption. Never dispatch Reviewer routinely, auto-invoke Analyze, or send Coder while blocked.
                  - id: route-readiness-before-reentry
                    type: switch
                    expression: '{{ steps.gate-readiness-before-reentry.output.readiness_gate.state }}'
                    cases:
                      ready: []
                      blocked:
                        - id: stop-readiness-before-reentry
                          type: prompt
                          integration: "{{ inputs.integration }}"
                          prompt: >-
                            Stop this Implement invocation before another FarmBoy Coder pass. Report the exact readiness blocker and safe Analyze resumption from gate-readiness-before-reentry.output.readiness_gate. Preserve completed implementation and Tasker work; do not treat task revision as substantive progress or resolve the code finding.
                    default:
                      - id: stop-readiness-before-reentry-unrecognized
                        type: prompt
                        integration: "{{ inputs.integration }}"
                        prompt: >-
                          Stop this Implement invocation before another FarmBoy Coder pass because the readiness gate returned no recognized state. Report the output and safe Analyze resumption.
                complete:
                  - id: track-reviewed-completion
                    command: speckit.tasks
                    integration: '{{ inputs.integration }}'
                    farmboy:
                      delegated: true
                      agent: FarmBoy Tasker
                    input:
                      args: >-
                        Track only whole task IDs that the fresh FarmBoy Code Reviewer substantiated in assess-implementation-after-pass.output.completed_task_ids, including validated administrative prerequisite proofs. Update only those task markers in {{ inputs.feature_context }}; preserve all descriptions and unrelated markers. Return before/after digests and exact changed IDs. A marker is routine tracking only and must never create completion or progress evidence.
                  - id: validate-reviewed-completion-tracking
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: >-
                      Revalidate the immutable requested scope and current task/spec/pointer bytes after Tasker tracking. Require the exact task-marker changes to be a subset of the independent Reviewer completed_task_ids, no changed task descriptions or unrelated markers, and current per-task completion proofs. Build and validate one append-only `task_tracking_successor` from the exact pre-Tasker task snapshot, Tasker before/after hashes and changed IDs, current scope digest, `FarmBoy Tasker` assignment, and matching independent Reviewer completion evidence; include it in the complete successor chain passed to `implementation-scope --project "$PWD"`. Return this validated record as structured `task_tracking_successor` output, or `null` when no marker changed. Return complete only if all requested tasks are independently substantiated and no buildable finding remains; otherwise return blocked with exact remaining IDs and safe resumption. Do not infer implementation completion from the Tasker response or checkbox alone.
                blocked: []
            - id: capture-post-pass-state
              type: prompt
              integration: "{{ inputs.integration }}"
              prompt: >-
                Build the capture request from this iteration's actual executed outputs only. The valid pairs are `revise-task-plan`/`validate-task-revision`, `track-reviewed-task-outcomes`/`validate-reviewed-task-tracking`, and `track-reviewed-completion`/`validate-reviewed-completion-tracking`. Select only the pair from the branch actually taken by `route-post-assessment`; never inspect an untaken branch or substitute the route-entry chain. Never substitute entry snapshots or read outputs from untaken branches. Serialize exactly these fields: `scope`, `trusted_request_reference`, `retained_scope_sha256`, `entry_history_sha256`, `task_tracking_successors`, `producer_pairs`, `eligibility_request`, and `completion_branch`. Also forward optional main-retained `retained_task_tracking_count`, `retained_task_tracking_sha256`, `budget_extension`, and `retained_budget_extension_sha256` when supplied. The `producer_pairs` array contains only the executed Tasker/validator pair, with each actual result and the validator's explicit `task_tracking_successor` field. The eligibility request must reflect current task bytes and the complete successor chain. Set `completion_branch` only when the completion branch executed. Invoke `python3 .specify/farmboy/scripts/python/controller.py post-pass-capture --project "$PWD"` with that JSON on stdin. The helper rereads and validates durable history as a descendant of the entry digest, validates producer pair identities and states, appends only returned successors, validates the whole chain against current task bytes and scope, and recomputes eligibility. Return its exact `post_pass_state` only on `ready`; otherwise return its exact blocked reason and safe resumption. A missing/invalid producer, stale history or successor, incomplete completion proof, or ineligible current state blocks. This capture earns no implementation progress.
            - id: route-scoped-execution
              type: prompt
              integration: "{{ inputs.integration }}"
              prompt: >-
                This is the final nondelegated routing node for this Implement pass. Read the already completed `route-post-assessment` branch result, captured `post_pass_state`, and readiness gate; a blocked readiness or post-pass capture result takes precedence over any continue outcome. Revalidate the original scope, active identity, full append-only Tasker successor chain and controller-owned history from `capture-post-pass-state.output.post_pass_state` before routing. Use its recomputed current eligibility; never substitute route-entry history, successor chain, or eligibility. Preserve the frozen substantive baseline and previous substantive assessment with its independently main-retained `retained_previous_assessment_sha256` scope/envelope binding; forward the retained digest unchanged to the scoped helper. Historical evidence hashes remain original and current assessment evidence must match current files; administrative proof earns zero source progress. Before returning, invoke installed readiness and scoped routing helpers with the captured state plus actual rendered assessment outputs. With zero source attempts, `implementation-route` may select only preparation or first-source work by declared-node membership. After any source attempt, pass the actual prior/current substantive assessments and frozen baseline through `implementation-progress-scoped`, which must use the unchanged generic no-progress predicate and common five-session/source-attempt caps by default; an explicitly bound operator receipt supplies the authorized run ceiling. Forward any independently retained explicit budget receipt/digest without changing consumed counters. Return exactly the validated helper's complete, continue or blocked result and precise reason/resumption. Never route from asserted counters, an unobserved receipt, a changed finding identity, or a Tasker marker. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces). For `complete`, omit `next_step_id`, `gate_step_id`, and `resume_action`; for `continue`, include only `next_step_id` targeting a declared loop-body step; for `blocked`, include only a stable `resume_action`. Never include a routing field for `complete`.

                First capture post-pass state from its actual producers. Read the durable history file again through `implementation-history` for this immutable scope after `record-preparation-session-outcome`, `record-source-session-outcome`, and any same-child answer recorded through the declared history adapter. Determine which Tasker/validator nodes actually executed from the selected `route-post-assessment` branch. For each executed route, collect a structured producer record containing the Tasker result, validator result, and the validator's `task_tracking_successor` (or explicit `null` when no marker changed); bind the Tasker and validator outputs to their exact step IDs and digests. The only valid pairs are `revise-task-plan` with `validate-task-revision`, `track-reviewed-task-outcomes` with `validate-reviewed-task-tracking`, and `track-reviewed-completion` with `validate-reviewed-completion-tracking`. Revision and task-outcome validators must return `ready`. The completion validator may return `complete` only for the executed completion branch after proving every requested task has current whole-task evidence and no buildable finding remains; a `blocked` result always takes precedence. Do not read or synthesize outputs for untaken branches. An executed branch with a missing result, invalid validator state, missing successor field, incomplete completion proof, or stale predecessor blocks with exact evidence and safe resumption. Append only the collected non-null validated successors to the incoming chain; never reuse or replace the entry snapshot. Validate the resulting chain against current task bytes. Recompute current eligibility from those validated current bytes. Preserve the historical prefix binding from the entry; validate new suffix witnesses against current bytes, then retain the returned complete prefix before later effects. Refresh only task-metadata evidence after a validated marker-only transition; stale source fulfillment or review proof requires independent reassessment, not hash substitution. Then pass the freshly read history, complete current successor chain, recomputed eligibility, frozen baseline, previous substantive assessment, and exact current Reviewer envelope into the scoped validators below.

                Rendered callback arguments:
                ```json
                {"scope": {{ steps.route-scoped-entry.output.scope }},"previous_assessment": {{ steps.route-scoped-entry.output.previous_assessment }},"retained_previous_assessment_sha256": "{{ steps.route-scoped-entry.output.retained_previous_assessment_sha256 }}","current_assessment": {{ steps.assess-implementation-after-pass.output.outcome_envelope }},"current_review": {{ steps.assess-implementation-after-pass.output.review }},"readiness": {{ steps.gate-readiness-before-core.output.readiness_gate }},"frozen_baseline": {{ steps.route-scoped-entry.output.baseline }},"post_pass_state": {{ steps.capture-post-pass-state.output.post_pass_state }}}
                ```
      blocked:
        - id: stop-readiness-before-core
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: >-
            Stop this Implement invocation before FarmBoy Coder. Report the exact readiness blocker and safe Analyze resumption from gate-readiness-before-core.output.readiness_gate. Do not dispatch core implementation or bypass its unchanged checklist gate.
    default:
      - id: stop-readiness-before-core-unrecognized
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: >-
          Stop this Implement invocation before FarmBoy Coder because the readiness gate returned no recognized state. Report the output and resume only after readiness is established.
  - id: report-implementation-outcome
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Report the latest evidenced outcome for {{ inputs.feature_context }}. If the Code Reviewer returned continue but the post-review readiness gate is blocked, that exact gate blocker and safe Analyze resumption take precedence: the loop exits before another Coder pass, while completed implementation and Tasker changes remain preserved. Otherwise report the latest assessment, completed and remaining task IDs, validation results, changed paths, and exact blocker or operator question and safe resumption point. A no-progress, blocked-readiness, or five-pass safety stop is not completion. Stop this workflow here. Converge, roadmap verification, Git integration, and feature acceptance require separate operator action.
