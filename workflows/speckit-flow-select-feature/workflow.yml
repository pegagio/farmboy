schema_version: '1.0'
workflow:
  id: speckit-flow-select-feature
  name: Select Active Feature
  version: "0.2.0"
  author: pegagio
  description: List and discuss roadmap choices, approve one selection, and activate its target without authoring a specification.
requires:
  speckit_version: '>=1.0.10.dev0'
  integrations:
    any:
      - codex
inputs:
  feature_request:
    type: string
    default: ''
    prompt: Optional roadmap filter or area of interest; the operator still selects a listed feature
  feature_selection:
    type: string
    default: ''
  selection_decision:
    type: string
    default: ''
  integration:
    type: string
    default: codex
    enum:
      - codex
steps:
  - id: list-roadmap-options
    type: prompt
    flow_kit:
      delegated: true
      agent: FlowKit-Roadmap Agent
    prompt: >-
      Read the configured roadmap and its documented lifecycle/dependency rules without modifying any file. Inventory available features before selecting one. Optional operator interest: {{ inputs.feature_request }}; it may highlight candidates but must not select one or hide their prerequisite chains. Return report, selection_options (a JSON array of distinct strings containing exact selectable roadmap entry identifiers plus defer), and evidence. In report, present a numbered table of dependency-ready candidates with exact entry ID/title, status, prerequisites, direct_unlock_count, and downstream_dependent_count. Also show blocked unfinished features with unsatisfied prerequisites, so the operator can see why a prerequisite may be the best next choice. Availability means eligible to start under the roadmap rules; do not treat terminal, deferred, abandoned, already-active, or ambiguous entries as new-start candidates. Existing specification paths must be identified without changing their content. Selection prepares the active feature, not specification authoring. Show simple text dependency chains for relevant unfinished features and the full prerequisite closure, e.g. Feature 29 -> Feature 28 -> Feature 26 (arrow means depends on); show every branch for multiple prerequisites and include current statuses. Use only actual roadmap edges. direct_unlock_count counts currently blocked features that would become dependency-ready if this candidate alone were completed under the roadmap rules; downstream_dependent_count counts distinct unfinished transitive dependents, not immediate unlocks. Deduplicate shared descendants and do not count completed features. Missing references, cycles, ambiguous entry identity, or undefined readiness rules must be reported rather than guessed; exclude unsafe candidates. If no candidates are safely selectable, explain why and return selection_options containing only defer. Order the candidate table by direct unlock count descending, then downstream dependent count descending, then roadmap order. Keep table numbers in the same order as selection_options, with defer last. Use full entry identifiers including titles so feature numbers cannot be mistaken for menu indices. Display the choices and dependency report for the human; do not pick a candidate, infer an answer from the request, mutate the roadmap, create a specification, or invoke another workflow.
  - id: select-roadmap-feature
    type: gate
    message: |-
      Choose the feature to start from this roadmap inventory. Dependency arrows mean depends on; direct unlocks and downstream dependents are different measures.
      {{ steps.list-roadmap-options.output.report }}
      We can discuss dependency chains and which prerequisites unblock the most work before you choose. Keep this gate pending while answering those questions from the inventory; a question is not a selection. Select one exact listed entry or defer. Choosing a feature does not approve a roadmap patch.
    options:
      - '{{ steps.list-roadmap-options.output.selection_options }}'
    verdict_input: feature_selection
    on_reject: skip
  - id: route-feature-selection
    type: switch
    expression: '{{ steps.select-roadmap-feature.output.choice }}'
    transition_labels:
      default: selected
    cases:
      defer: []
    default:
      - id: prepare-feature-selection
        type: prompt
        prompt: >-
          Re-read only the exact operator-selected roadmap entry {{ steps.select-roadmap-feature.output.choice }} and its prerequisites. Return state ready or blocked; selected_entry_id; feature_brief; feature_directory; proposed_patch; feature_json; and evidence. Blocked includes required operator input; give the cause, question, and recovery action. Do not substitute another candidate. For an existing spec, use its uniquely owned roadmap Spec dir and preserve all specification bytes and record the existing spec digest in evidence. Otherwise reuse a uniquely mapped target directory or propose one normalized repository-relative directory for later authoring; it may not exist yet. Reject conflicting ownership, escaping paths, malformed active state, or ambiguous target identity. feature_json must be the exact proposed .specify/feature.json payload preserving existing additional fields with feature_directory set to that target. proposed_patch contains only the selected entry's reviewed active lifecycle transition and any missing or stale Spec dir linkage needed to identify that target. Do not mark a new specification specced before it is authored. Follow the roadmap's lifecycle rules; unclear transition authority requires operator input. Do not write the roadmap, pointer, directory, or specification.
        flow_kit:
          delegated: true
          agent: FlowKit-Roadmap Agent
      - id: route-selection-readiness
        type: switch
        expression: '{{ steps.prepare-feature-selection.output.state }}'
        cases:
          ready:
            - id: approve-feature-selection
              type: gate
              message: |-
                Review this exact selection for {{ steps.prepare-feature-selection.output.selected_entry_id }}:
                {{ steps.prepare-feature-selection.output.feature_brief }}
                Roadmap patch:
                {{ steps.prepare-feature-selection.output.proposed_patch }}
                Active feature JSON:
                {{ steps.prepare-feature-selection.output.feature_json }}
                Approve these changes only. No specification or feature directory will be created or modified.
              options:
                - approve
                - amend
                - defer
              verdict_input: selection_decision
              on_reject: skip
            - id: route-selection-approval
              type: switch
              expression: '{{ steps.approve-feature-selection.output.choice }}'
              transition_labels:
                approve: approved
                default: not-approved
              cases:
                approve:
                  - id: apply-selected-roadmap-patch
                    command: speckit.flow-roadmap.write
                    integration: '{{ inputs.integration }}'
                    input:
                      args: >-
                        Apply only this exactly approved selection patch for existing entry {{ steps.prepare-feature-selection.output.selected_entry_id }}: {{ steps.prepare-feature-selection.output.proposed_patch }}. Preserve any existing specification and do not author one or change another entry.
                  - id: activate-selected-feature
                    type: prompt
                    prompt: >-
                      After the approved roadmap write succeeds, verify the selected entry {{ steps.prepare-feature-selection.output.selected_entry_id }} uniquely maps to {{ steps.prepare-feature-selection.output.feature_directory }}. Only then call the installed controller helper activate-feature with project root and JSON on stdin containing feature_directory equal to that exact approved target. Capture its result; it updates only .specify/feature.json, preserving other fields. Do not create the feature directory, spec.md, checklist, branch, or other artifact. If the write or pointer activation fails, stop and report the partial state and exact recovery action; do not silently undo the approved roadmap change or create another feature.
                  - id: verify-feature-selection
                    type: prompt
                    prompt: >-
                      Re-read the selected roadmap row and .specify/feature.json. Verify the unique exact entry-to-directory mapping and active pointer agree with the approved selection, and no specification was created or modified. Return selected_entry_id, feature_directory, existing_spec state, evidence, and any blocker. A target directory without spec.md is a valid selection awaiting authoring, not a missing prerequisite to repair by creating a spec. Stop for divergence; do not claim activation from command success alone.
                    flow_kit:
                      delegated: true
                      agent: FlowKit-Reviewer
              default: []
          blocked: []
  - id: report-feature-selection
    type: prompt
    prompt: >-
      Report the inventory and the operator's exact selection or deferral, approved roadmap changes, active feature directory, whether an existing spec was preserved or authoring is pending, and verification evidence. Missing or failed activation is a blocker; explain any roadmap-write/pointer partial state and recovery action. Stop here. Specification authoring requires separate operator invocation of speckit-flow-specify. Do not author a spec, invoke another workflow, integrate Git, or claim acceptance.
